<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>THEHATSSHOPMX — Catálogo</title><!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>THEHATSSHOPMX — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--mut:#6b6b6b;--line:#dcdcd8;--cell:#f3f3f1;--ring:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--ink:#f2f2f0;--mut:#9a9a9a;--line:#2a2a2a;--ring:#f2f2f0}}
:root[data-theme="dark"]{--bg:#0d0d0d;--ink:#f2f2f0;--mut:#9a9a9a;--line:#2a2a2a;--ring:#f2f2f0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{text-align:center;padding:40px 20px 24px;border-bottom:1px solid var(--line)}
.stage{perspective:700px;width:96px;height:96px;margin:0 auto 22px}
#logo{width:96px;height:96px;display:flex;align-items:center;justify-content:center;animation:spin 9s linear infinite;transform-style:preserve-3d;will-change:transform}
#logo img{width:100%;height:100%;object-fit:contain;display:block;backface-visibility:visible;-webkit-user-drag:none}
@keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){#logo{animation:none}}
h1{font-size:clamp(26px,6vw,44px);font-weight:600;letter-spacing:.14em}
.sub{margin-top:8px;font-weight:300;font-size:18px}.sub2{color:var(--mut);font-size:15px;letter-spacing:.08em;margin-top:4px}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
nav a{color:var(--ink);text-decoration:none;font-size:15px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:10px 16px;border-radius:999px}
main{max-width:1200px;margin:0 auto;padding:0 20px}
section{padding:44px 0 8px}h2{font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;color:var(--mut);padding-bottom:14px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:920px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{padding:28px 18px 32px;border-bottom:1px solid var(--line)}
@media (min-width:600px){.card{border-right:1px solid var(--line)}}
.ph{position:relative;background:var(--cell);aspect-ratio:1/1.05;display:flex;align-items:center;justify-content:center;padding:22px}
.ph img{max-width:100%;max-height:100%;object-fit:contain}
.tag{position:absolute;top:12px;left:12px;border:1px solid #111;color:#111;font-size:13px;letter-spacing:.2em;padding:6px 10px;font-weight:600}
.n{margin-top:20px;font-size:15px;letter-spacing:.2em;color:var(--mut)}
h3{font-size:19px;font-weight:600;letter-spacing:.05em;margin-top:6px}
.dz{font-size:17px;margin-top:6px}.ds{font-size:16px;line-height:1.5;color:var(--mut);margin-top:10px}
.old{margin-top:18px;color:var(--mut);text-decoration:line-through;font-size:17px}
.new{font-size:34px;font-weight:600;line-height:1.2}.new small{font-size:16px;font-weight:400;color:var(--mut)}
footer{margin-top:48px;background:#0d0d0d;color:#fff;padding:56px 20px calc(48px + env(safe-area-inset-bottom,0px))}
.ft{max-width:1200px;margin:0 auto}.ft h2{color:#9a9a9a;border-color:#3a3a3a}.ft h4{font-size:30px;letter-spacing:.12em;margin:26px 0 8px;font-weight:600}
.row{padding:18px 0;border-bottom:1px solid #3a3a3a}.row span{display:block;font-size:14px;letter-spacing:.25em;color:#9a9a9a;margin-bottom:6px}.row a,.row b{color:#fff;font-weight:400;font-size:22px;text-decoration:none}
</style></head><body>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--mut:#6b6b6b;--line:#dcdcd8;--cell:#f3f3f1;--ring:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--ink:#f2f2f0;--mut:#9a9a9a;--line:#2a2a2a;--ring:#f2f2f0}}
:root[data-theme="dark"]{--bg:#0d0d0d;--ink:#f2f2f0;--mut:#9a9a9a;--line:#2a2a2a;--ring:#f2f2f0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{text-align:center;padding:40px 20px 24px;border-bottom:1px solid var(--line)}
.stage{perspective:700px;width:96px;height:96px;margin:0 auto 22px}
#logo{width:96px;height:96px;display:flex;align-items:center;justify-content:center;animation:spin 9s linear infinite;transform-style:preserve-3d;will-change:transform}
#logo img{width:100%;height:100%;object-fit:contain;display:block;backface-visibility:visible;-webkit-user-drag:none}
@keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){#logo{animation:none}}
h1{font-size:clamp(26px,6vw,44px);font-weight:600;letter-spacing:.14em}
.sub{margin-top:8px;font-weight:300;font-size:18px}.sub2{color:var(--mut);font-size:15px;letter-spacing:.08em;margin-top:4px}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
nav a{color:var(--ink);text-decoration:none;font-size:15px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:10px 16px;border-radius:999px}
main{max-width:1200px;margin:0 auto;padding:0 20px}
section{padding:44px 0 8px}h2{font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;color:var(--mut);padding-bottom:14px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:920px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{padding:28px 18px 32px;border-bottom:1px solid var(--line)}
@media (min-width:600px){.card{border-right:1px solid var(--line)}}
.ph{position:relative;background:var(--cell);aspect-ratio:1/1.05;display:flex;align-items:center;justify-content:center;padding:22px}
.ph img{max-width:100%;max-height:100%;object-fit:contain}
.tag{position:absolute;top:12px;left:12px;border:1px solid #111;color:#111;font-size:13px;letter-spacing:.2em;padding:6px 10px;font-weight:600}
.n{margin-top:20px;font-size:15px;letter-spacing:.2em;color:var(--mut)}
h3{font-size:19px;font-weight:600;letter-spacing:.05em;margin-top:6px}
.dz{font-size:17px;margin-top:6px}.ds{font-size:16px;line-height:1.5;color:var(--mut);margin-top:10px}
.old{margin-top:18px;color:var(--mut);text-decoration:line-through;font-size:17px}
.new{font-size:34px;font-weight:600;line-height:1.2}.new small{font-size:16px;font-weight:400;color:var(--mut)}
footer{margin-top:48px;background:#0d0d0d;color:#fff;padding:56px 20px calc(48px + env(safe-area-inset-bottom,0px))}
.ft{max-width:1200px;margin:0 auto}.ft h2{color:#9a9a9a;border-color:#3a3a3a}.ft h4{font-size:30px;letter-spacing:.12em;margin:26px 0 8px;font-weight:600}
.row{padding:18px 0;border-bottom:1px solid #3a3a3a}.row span{display:block;font-size:14px;letter-spacing:.25em;color:#9a9a9a;margin-bottom:6px}.row a,.row b{color:#fff;font-weight:400;font-size:22px;text-decoration:none}
